spring.application.name=backend
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %level %logger{40} [requestId=%X{requestId:--}] %msg %kvp%n%ex
logging.structured.format.console=${LOG_FORMATO_CONSOLE:}
logging.level.org.hibernate.SQL=${LOG_NIVEL_SQL:INFO}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:financas}
spring.datasource.username=${DB_USER:financas}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
